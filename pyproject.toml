[project]
name = "icloud-mcp"
version = "0.1.0"
description = "MCP server for iCloud Calendar (CalDAV) and Mail (IMAP/SMTP) over Streamable HTTP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13.0,<2",
    "caldav>=1.3.9",
    "icalendar>=5.0.11",
    "imap-tools>=1.7.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
