# Reference manifests. In the Flux repo these live under clusters/homelab/apps,
# the image is pinned by digest, and the Secret is a SealedSecret.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: icloud-mcp
  namespace: mcp
spec:
  replicas: 1
  selector:
    matchLabels: { app: icloud-mcp }
  template:
    metadata:
      labels: { app: icloud-mcp }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: icloud-mcp
          image: ghcr.io/dseif0x/icloud-mcp:latest # pinned by digest via Flux
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - secretRef: { name: icloud-mcp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: icloud-mcp
  namespace: mcp
spec:
  selector: { app: icloud-mcp }
  ports:
    - { name: http, port: 8080, targetPort: http }
