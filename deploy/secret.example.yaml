# The real secret is a SealedSecret generated from your pasted credentials:
#   kubectl -n mcp create secret generic icloud-mcp \
#     --from-literal=APPLE_ID=you@icloud.com \
#     --from-literal=APPLE_APP_PW=xxxx-xxxx-xxxx-xxxx \
#     --from-literal=MCP_BEARER_TOKEN=$(openssl rand -hex 24) \
#     --dry-run=client -o yaml | kubeseal --format yaml > sealedsecret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: icloud-mcp
  namespace: mcp
type: Opaque
stringData:
  APPLE_ID: "you@icloud.com"
  APPLE_APP_PW: "xxxx-xxxx-xxxx-xxxx"
  MCP_BEARER_TOKEN: "generate-a-long-random-token"
